name: video-insight

services:
  video-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${VIDEO_DB_NAME}
      POSTGRES_USER: ${VIDEO_DB_USER}
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD}
    ports:
      - "${VIDEO_DB_PORT}:5432"
    volumes:
      - video-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [video-insight]

  job-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${JOB_DB_NAME}
      POSTGRES_USER: ${JOB_DB_USER}
      POSTGRES_PASSWORD: ${JOB_DB_PASSWORD}
    ports:
      - "${JOB_DB_PORT}:5432"
    volumes:
      - job-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [video-insight]

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [video-insight]

  minio:
    image: video-insight/minio-local:RELEASE.2025-09-07T16-13-09Z
    build: ./minio
    pull_policy: build
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [video-insight]

  job-service:
    profiles: [app]
    build: ../services/job-service
    environment:
      DB_URL: jdbc:postgresql://job-db:5432/${JOB_DB_NAME}
      DB_USER: ${JOB_DB_USER}
      DB_PASSWORD: ${JOB_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      VIDEO_SERVICE_URL: ${VIDEO_SERVICE_URL}
    ports:
      - "${JOB_SERVICE_PORT}:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      job-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks: [video-insight]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [video-insight]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [video-insight]

networks:
  video-insight:
    name: video-insight

volumes:
  video-db-data:
  job-db-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:

name: video-insight-https

services:
  https:
    image: caddy:2.11.7-alpine
    container_name: video-insight-https
    network_mode: host
    mem_limit: 128m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

spring:
  application:
    name: job-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/video_insight_jobs}
    username: ${DB_USER:job_service}
    password: ${DB_PASSWORD:local-job-password}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:video_insight}
    password: ${RABBITMQ_PASSWORD:local-rabbitmq-password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

server:
  port: 8080
  tomcat:
    threads:
      max: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

job-service:
  messaging:
    exchange: ${MESSAGING_EXCHANGE:video-insight.events}
    events-queue: ${MESSAGING_EVENTS_QUEUE:job-service.processing-events}
    requests-queue: ${MESSAGING_REQUESTS_QUEUE:processing-service.requests}
    dead-letter-exchange: ${MESSAGING_DLX:video-insight.dlx}
  outbox:
    scheduler-enabled: true
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
    batch-size: 50
  video-service:
    base-url: ${VIDEO_SERVICE_URL:http://localhost:8081}
    storage-key-template: ${VIDEO_STORAGE_KEY_TEMPLATE:videos/{videoId}/original.mp4}
    timeout: 3s
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:video_insight}
    secret-key: ${STORAGE_SECRET_KEY:local-minio-password}
    bucket: ${STORAGE_BUCKET:video-insight}
    presign-ttl: 15m

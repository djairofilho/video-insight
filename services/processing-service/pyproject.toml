[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-insight-processing-service"
version = "0.1.0"
description = "Pipeline assíncrono de mídia e IA do Video Insight"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/processing_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

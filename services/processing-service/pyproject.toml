[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-insight-processing-service"
version = "0.1.0"
description = "Pipeline assíncrono de mídia e IA do Video Insight"
requires-python = ">=3.12"
dependencies = [
  "aio-pika==10.1.0",
  "fastapi==0.141.1",
  "google-genai==2.25.0",
  "httpx==0.28.1",
  "minio==7.2.20",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "testcontainers[minio,rabbitmq]==4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/processing_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=processing_service --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: exige Docker ou FFmpeg instalados; é ignorado quando indisponível",
]

name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - apps/frontend/**
      - apps/api-gateway/**
      - services/video-service/**
      - services/job-service/**
      - services/processing-service/**
      - infrastructure/aws/**
      - .github/workflows/deploy-aws.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-insight-aws
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      video: ${{ steps.filter.outputs.video }}
      job: ${{ steps.filter.outputs.job }}
      processing: ${{ steps.filter.outputs.processing }}
      core: ${{ steps.filter.outputs.core }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'infrastructure/aws/frontend/**'
              - '.github/workflows/deploy-aws.yml'
            gateway:
              - 'apps/api-gateway/**'
              - '.github/workflows/deploy-aws.yml'
            video:
              - 'services/video-service/**'
              - 'infrastructure/aws/tunnels/video-service-tunnel.service'
              - '.github/workflows/deploy-aws.yml'
            job:
              - 'services/job-service/**'
              - 'infrastructure/aws/tunnels/job-service-tunnel.service'
              - '.github/workflows/deploy-aws.yml'
            processing:
              - 'services/processing-service/**'
              - 'infrastructure/aws/tunnels/processing-service-tunnel.service'
              - '.github/workflows/deploy-aws.yml'
            core:
              - 'infrastructure/aws/core/**'
              - '.github/workflows/deploy-aws.yml'
            observability:
              - 'infrastructure/aws/observability/**'
              - '.github/workflows/deploy-aws.yml'

  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require production authentication and HTTPS
        env:
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          STORAGE_PUBLIC_ENDPOINT: ${{ vars.STORAGE_PUBLIC_ENDPOINT }}
        run: |
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlparse
          for key in ('AUTH_ISSUER', 'FRONTEND_ORIGIN', 'STORAGE_PUBLIC_ENDPOINT'):
              value = os.environ[key]
              parsed = urlparse(value)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.query or parsed.fragment:
                  raise SystemExit(f'{key} deve ser uma URL HTTPS válida')
          if not os.environ['AUTH_ISSUER'].endswith('/'):
              raise SystemExit('AUTH_ISSUER precisa terminar com /')
          if not os.environ['AUTH_AUDIENCE'].strip():
              raise SystemExit('AUTH_AUDIENCE é obrigatório')
          PYTHON

  deploy-video:
    needs: [changes, preflight, deploy-core]
    if: >-
      always() && needs.preflight.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.video == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test image
        run: docker build -t "video-insight/video-service:${GITHUB_SHA}" services/video-service
      - name: Package image
        run: docker save "video-insight/video-service:${GITHUB_SHA}" | gzip > /tmp/video-service.tar.gz
      - &ssh_setup
        name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/video-insight
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/video-insight ~/.ssh/known_hosts
      - name: Install Video Service dependency tunnel
        env:
          HOST: ${{ vars.AWS_VIDEO_HOST }}
        run: |
          scp -i ~/.ssh/video-insight infrastructure/aws/tunnels/video-service-tunnel.service ubuntu@"$HOST":/tmp/video-insight-core-tunnel.service
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; sudo install -m 644 /tmp/video-insight-core-tunnel.service /etc/systemd/system/video-insight-core-tunnel.service; rm -f /tmp/video-insight-core-tunnel.service; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 15433 proto tcp; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 19000 proto tcp; sudo systemctl daemon-reload; sudo systemctl enable video-insight-core-tunnel.service; sudo systemctl restart video-insight-core-tunnel.service"
      - name: Deploy Video Service
        env:
          HOST: ${{ vars.AWS_VIDEO_HOST }}
          STORAGE_PUBLIC_ENDPOINT: ${{ vars.STORAGE_PUBLIC_ENDPOINT }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          VIDEO_DB_PASSWORD: ${{ secrets.VIDEO_DB_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          umask 077
          # Dependências alcançadas pelos túneis SSH na ponte do Docker (infrastructure/aws/tunnels).
          {
            echo 'DB_URL=jdbc:postgresql://172.17.0.1:15433/video_insight_videos'
            echo 'DB_USER=video_service'
            printf 'DB_PASSWORD=%s\n' "$VIDEO_DB_PASSWORD"
            echo 'STORAGE_ENDPOINT=http://172.17.0.1:19000'
            printf 'STORAGE_PUBLIC_ENDPOINT=%s\n' "$STORAGE_PUBLIC_ENDPOINT"
            echo 'AUTH_ENABLED=true'
            printf 'AUTH_ISSUER=%s\n' "$AUTH_ISSUER"
            printf 'AUTH_AUDIENCE=%s\n' "$AUTH_AUDIENCE"
            echo 'STORAGE_ACCESS_KEY=video_insight'
            printf 'STORAGE_SECRET_KEY=%s\n' "$MINIO_ROOT_PASSWORD"
          } > /tmp/video.env
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo install -d -o ubuntu -g ubuntu -m 700 /opt/video-insight/video'
          scp -i ~/.ssh/video-insight /tmp/video.env ubuntu@"$HOST":/opt/video-insight/video/video.env
          rm -f /tmp/video.env
          scp -i ~/.ssh/video-insight /tmp/video-service.tar.gz ubuntu@"$HOST":/tmp/video-service.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; chmod 600 /opt/video-insight/video/video.env; sudo docker load -i /tmp/video-service.tar.gz; sudo docker rm -f video-insight-video 2>/dev/null || true; sudo docker run -d --name video-insight-video --restart unless-stopped --memory 320m --env-file /opt/video-insight/video/video.env -p 8081:8080 video-insight/video-service:${GITHUB_SHA}; rm -f /tmp/video-service.tar.gz; sudo docker image prune -af"
          for _ in {1..20}; do
            ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'curl --fail --silent http://localhost:8081/health' && exit 0
            sleep 3
          done
          exit 1

  deploy-job:
    needs: [changes, preflight, deploy-core]
    if: >-
      always() && needs.preflight.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.job == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: video-insight-leonardo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Build and test image
        run: docker build -t "video-insight/job-service:${GITHUB_SHA}" services/job-service
      - name: Package image
        run: docker save "video-insight/job-service:${GITHUB_SHA}" | gzip > /tmp/job-service.tar.gz
      - *ssh_setup
      - name: Install Job Service dependency tunnel
        env:
          HOST: ${{ vars.AWS_OBSERVABILITY_HOST }}
        run: |
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo test -r /etc/video-insight/tunnel_ed25519 && sudo test -r /etc/video-insight/known_hosts'
          scp -i ~/.ssh/video-insight infrastructure/aws/tunnels/job-service-tunnel.service ubuntu@"$HOST":/tmp/video-insight-core-tunnel.service
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; sudo install -m 644 /tmp/video-insight-core-tunnel.service /etc/systemd/system/video-insight-core-tunnel.service; rm -f /tmp/video-insight-core-tunnel.service; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 15434 proto tcp; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 15672 proto tcp; sudo systemctl daemon-reload; sudo systemctl enable video-insight-core-tunnel.service; sudo systemctl restart video-insight-core-tunnel.service; sudo systemctl is-active --quiet video-insight-core-tunnel.service"
      - name: Deploy Job Service
        env:
          HOST: ${{ vars.AWS_OBSERVABILITY_HOST }}
          STORAGE_PUBLIC_ENDPOINT: ${{ vars.STORAGE_PUBLIC_ENDPOINT }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          AUTH_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          JOB_DB_PASSWORD: ${{ secrets.JOB_DB_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          umask 077
          # Banco e RabbitMQ usam túneis SSH; MinIO usa o endereço privado do Core.
          {
            echo 'DB_URL=jdbc:postgresql://172.17.0.1:15434/video_insight_jobs'
            echo 'DB_USER=job_service'
            printf 'DB_PASSWORD=%s\n' "$JOB_DB_PASSWORD"
            echo 'RABBITMQ_HOST=172.17.0.1'
            echo 'RABBITMQ_PORT=15672'
            echo 'RABBITMQ_USER=video_insight'
            printf 'RABBITMQ_PASSWORD=%s\n' "$RABBITMQ_PASSWORD"
            echo 'STORAGE_ENDPOINT=http://172.31.8.165:8081'
            printf 'STORAGE_PUBLIC_ENDPOINT=%s\n' "$STORAGE_PUBLIC_ENDPOINT"
            echo 'AUTH_ENABLED=true'
            printf 'AUTH_ISSUER=%s\n' "$AUTH_ISSUER"
            printf 'AUTH_AUDIENCE=%s\n' "$AUTH_AUDIENCE"
            echo 'STORAGE_ACCESS_KEY=video_insight'
            printf 'STORAGE_SECRET_KEY=%s\n' "$MINIO_ROOT_PASSWORD"
            echo 'VIDEO_SERVICE_URL=http://172.31.1.54:8081'
          } > /tmp/job.env
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo install -d -o ubuntu -g ubuntu -m 700 /opt/video-insight/job'
          scp -i ~/.ssh/video-insight /tmp/job.env ubuntu@"$HOST":/opt/video-insight/job/job.env
          rm -f /tmp/job.env
          scp -i ~/.ssh/video-insight /tmp/job-service.tar.gz ubuntu@"$HOST":/tmp/job-service.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; chmod 600 /opt/video-insight/job/job.env; sudo docker load -i /tmp/job-service.tar.gz; sudo docker rm -f video-insight-job 2>/dev/null || true; sudo docker run -d --name video-insight-job --restart unless-stopped --memory 320m --env-file /opt/video-insight/job/job.env -p 8081:8080 video-insight/job-service:${GITHUB_SHA}; rm -f /tmp/job-service.tar.gz; sudo docker image prune -af"
          for _ in {1..20}; do
            ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'curl --fail --silent http://localhost:8081/health' && exit 0
            sleep 3
          done
          exit 1

  deploy-processing:
    needs: [changes, preflight, deploy-core]
    if: >-
      always() && needs.preflight.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.processing == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build and test
        working-directory: services/processing-service
        run: |
          python -m pip install '.[test]'
          pytest
          docker build -t "video-insight/processing-service:${GITHUB_SHA}" .
          docker run --rm "video-insight/processing-service:${GITHUB_SHA}" ffmpeg -version >/dev/null
          docker run --rm "video-insight/processing-service:${GITHUB_SHA}" ffprobe -version >/dev/null
      - name: Package image
        run: docker save "video-insight/processing-service:${GITHUB_SHA}" | gzip > /tmp/processing-service.tar.gz
      - *ssh_setup
      - name: Reclaim space on Processing Service host
        env:
          HOST: ${{ vars.AWS_PROCESSING_HOST }}
        run: ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'bash -s' < infrastructure/aws/processing/reclaim-vscode-cache.sh
      - name: Install Processing Service dependency tunnel
        env:
          HOST: ${{ vars.AWS_PROCESSING_HOST }}
        run: |
          scp -i ~/.ssh/video-insight infrastructure/aws/tunnels/processing-service-tunnel.service ubuntu@"$HOST":/tmp/video-insight-core-tunnel.service
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; sudo install -m 644 /tmp/video-insight-core-tunnel.service /etc/systemd/system/video-insight-core-tunnel.service; rm -f /tmp/video-insight-core-tunnel.service; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 15672 proto tcp; sudo ufw allow in on docker0 from 172.17.0.0/16 to 172.17.0.1 port 19000 proto tcp; sudo systemctl daemon-reload; sudo systemctl enable video-insight-core-tunnel.service; sudo systemctl restart video-insight-core-tunnel.service"
      - name: Deploy Processing Service
        env:
          HOST: ${{ vars.AWS_PROCESSING_HOST }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_ROOT_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            rm -f /tmp/processing.env /tmp/processing-service.tar.gz
            ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'rm -f ~/processing.env' || true
          }
          trap cleanup EXIT
          printf '%s\n' \
            "RABBITMQ_HOST=172.17.0.1" \
            "RABBITMQ_PORT=15672" \
            "RABBITMQ_USER=video_insight" \
            "RABBITMQ_PASSWORD=$RABBITMQ_PASSWORD" \
            "MINIO_ENDPOINT=172.17.0.1:19000" \
            "MINIO_ACCESS_KEY=video_insight" \
            "MINIO_SECRET_KEY=$MINIO_SECRET_KEY" \
            "GROQ_API_KEY=$GROQ_API_KEY" \
            "GEMINI_API_KEY=$GEMINI_API_KEY" > /tmp/processing.env
          scp -i ~/.ssh/video-insight /tmp/processing.env ubuntu@"$HOST":processing.env
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'chmod 600 ~/processing.env; sudo docker image prune -af'
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo docker load' < /tmp/processing-service.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; sudo docker run --rm --entrypoint /bin/true video-insight/processing-service:${GITHUB_SHA}; sudo docker rm -f video-insight-processing 2>/dev/null || true; sudo docker run -d --name video-insight-processing --restart unless-stopped --memory 320m --env-file ~/processing.env -p 8081:8080 video-insight/processing-service:${GITHUB_SHA}"
          for _ in {1..20}; do
            if ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'curl --fail --silent http://localhost:8081/health'; then
              ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo docker image prune -af'
              exit 0
            fi
            sleep 3
          done
          exit 1

  deploy-core:
    needs: [changes, preflight]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *ssh_setup
      - name: Package verified MinIO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          binary=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          gh release download RELEASE.2025-09-07T16-13-09Z --repo minio/minio --pattern "$binary" --dir /tmp
          printf '%s  %s\n' '7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f' "/tmp/$binary" | sha256sum -c -
          install -m 755 "/tmp/$binary" infrastructure/aws/core/minio/minio
          docker build -t video-insight/minio:RELEASE.2025-09-07T16-13-09Z infrastructure/aws/core/minio
          docker save video-insight/minio:RELEASE.2025-09-07T16-13-09Z | gzip > /tmp/minio-image.tar.gz
          rm -f infrastructure/aws/core/minio/minio "/tmp/$binary"
      - name: Deploy databases, RabbitMQ and MinIO
        env:
          HOST: ${{ vars.AWS_CORE_HOST }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          VIDEO_DB_PASSWORD: ${{ secrets.VIDEO_DB_PASSWORD }}
          JOB_DB_PASSWORD: ${{ secrets.JOB_DB_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -e
          umask 077
          cleanup() {
            rm -f /tmp/core.env /tmp/minio-image.tar.gz
            ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'rm -f /opt/video-insight/core/core.env /tmp/minio-image.tar.gz' || true
          }
          trap cleanup EXIT
          printf 'VIDEO_DB_PASSWORD=%s\nJOB_DB_PASSWORD=%s\nRABBITMQ_PASSWORD=%s\nMINIO_ROOT_PASSWORD=%s\n' "$VIDEO_DB_PASSWORD" "$JOB_DB_PASSWORD" "$RABBITMQ_PASSWORD" "$MINIO_ROOT_PASSWORD" > /tmp/core.env
          printf 'FRONTEND_ORIGIN=%s\n' "$FRONTEND_ORIGIN" >> /tmp/core.env
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo install -d -o ubuntu -g ubuntu /opt/video-insight/core'
          scp -i ~/.ssh/video-insight infrastructure/aws/core/compose.yaml /tmp/core.env ubuntu@"$HOST":/opt/video-insight/core/
          scp -i ~/.ssh/video-insight /tmp/minio-image.tar.gz ubuntu@"$HOST":/tmp/minio-image.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'set -e; cd /opt/video-insight/core; sudo ufw allow 8081/tcp; sudo docker load -i /tmp/minio-image.tar.gz; sudo docker run --rm --user 0:0 --entrypoint chown -v video-insight-core_minio-data:/data video-insight/minio:RELEASE.2025-09-07T16-13-09Z -R 10001:10001 /data; sudo docker compose --env-file core.env up -d --remove-orphans --wait --wait-timeout 180; sudo docker image prune -af'

  deploy-observability:
    needs: [changes, preflight]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: video-insight-leonardo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - *ssh_setup
      - name: Deploy Prometheus and Grafana
        env:
          HOST: ${{ vars.AWS_OBSERVABILITY_HOST }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -e
          umask 077
          cleanup() {
            rm -f /tmp/observability.env
            ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'rm -f /opt/video-insight/observability/observability.env' || true
          }
          trap cleanup EXIT
          printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD" > /tmp/observability.env
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'sudo install -d -o ubuntu -g ubuntu /opt/video-insight/observability'
          scp -i ~/.ssh/video-insight infrastructure/aws/observability/* /tmp/observability.env ubuntu@"$HOST":/opt/video-insight/observability/
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'cd /opt/video-insight/observability && sudo docker compose --env-file observability.env up -d --remove-orphans --force-recreate && sudo docker image prune -af'

  deploy-gateway:
    needs: [changes, preflight, deploy-video, deploy-job, deploy-processing]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.video == 'true' || needs.changes.outputs.job == 'true' ||
      needs.changes.outputs.processing == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, validate and build gateway
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          python3 apps/api-gateway/configure.py
          docker build -t "video-insight/api-gateway:${GITHUB_SHA}" apps/api-gateway
          docker run --rm "video-insight/api-gateway:${GITHUB_SHA}" check -c /etc/krakend/krakend.json
      - name: Package image
        run: docker save "video-insight/api-gateway:${GITHUB_SHA}" | gzip > /tmp/api-gateway.tar.gz
      - *ssh_setup
      - name: Deploy KrakenD
        env:
          HOST: ${{ vars.AWS_GATEWAY_HOST }}
        run: |
          scp -i ~/.ssh/video-insight /tmp/api-gateway.tar.gz ubuntu@"$HOST":/tmp/api-gateway.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "set -e; sudo ufw allow 8081/tcp; sudo docker load -i /tmp/api-gateway.tar.gz; sudo docker rm -f video-insight-gateway 2>/dev/null || true; sudo docker run -d --name video-insight-gateway --restart unless-stopped --memory 256m -p 8081:8080 video-insight/api-gateway:${GITHUB_SHA}; rm -f /tmp/api-gateway.tar.gz; sudo docker image prune -af"
          for endpoint in video jobs processing; do
            healthy=false
            for _ in {1..20}; do
              if ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "curl --fail --silent http://localhost:8081/health/$endpoint"; then
                healthy=true
                break
              fi
              sleep 3
            done
            test "$healthy" = true
          done
          status=$(ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8081/api/v1/videos')
          test "$status" = 401

  deploy-frontend:
    needs: [changes, preflight, deploy-core, deploy-video, deploy-job, deploy-processing, deploy-gateway]
    if: >-
      always() && needs.preflight.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.AWS_FRONTEND_HOST }}
      FRONTEND_PORT: ${{ vars.AWS_FRONTEND_PORT || '8081' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Validate frontend settings
        env:
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          API_PUBLIC_BASE_URL: ${{ vars.API_PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlparse
          if not os.environ['HOST'].strip():
              raise SystemExit('Configure AWS_FRONTEND_HOST')
          port = os.environ['FRONTEND_PORT']
          if not port.isdigit() or not 1024 <= int(port) <= 65535:
              raise SystemExit('AWS_FRONTEND_PORT deve estar entre 1024 e 65535')
          if not os.environ['AUTH0_CLIENT_ID'].strip():
              raise SystemExit('Configure AUTH0_CLIENT_ID com o Client ID da SPA')
          api = urlparse(os.environ['API_PUBLIC_BASE_URL'])
          if api.scheme != 'https' or not api.hostname or api.path.rstrip('/') != '/api/v1' or api.query or api.fragment:
              raise SystemExit('API_PUBLIC_BASE_URL deve ser HTTPS e terminar em /api/v1')
          PYTHON
      - name: Install, lint and test frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build production frontend
        working-directory: apps/frontend
        env:
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH_AUDIENCE }}
          VITE_API_BASE_URL: ${{ vars.API_PUBLIC_BASE_URL }}
          VITE_USE_MOCKS: 'false'
        run: |
          export VITE_AUTH0_DOMAIN="${AUTH_ISSUER#https://}"
          export VITE_AUTH0_DOMAIN="${VITE_AUTH0_DOMAIN%/}"
          npm run build
      - name: Build and package Nginx image
        run: |
          docker build -t "video-insight/frontend:${GITHUB_SHA}" apps/frontend
          docker save "video-insight/frontend:${GITHUB_SHA}" | gzip > /tmp/frontend.tar.gz
      - *ssh_setup
      - name: Deploy frontend with health checks and rollback
        run: |
          scp -i ~/.ssh/video-insight /tmp/frontend.tar.gz ubuntu@"$HOST":/tmp/video-insight-frontend.tar.gz
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" 'set -e; sudo docker load -i /tmp/video-insight-frontend.tar.gz; rm -f /tmp/video-insight-frontend.tar.gz'
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "sudo ufw allow ${FRONTEND_PORT}/tcp"
          ssh -i ~/.ssh/video-insight ubuntu@"$HOST" "bash -s -- video-insight/frontend:${GITHUB_SHA} ${FRONTEND_PORT}" < infrastructure/aws/frontend/deploy.sh

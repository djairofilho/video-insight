name: Validate repository

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      full-validation:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      video_service: ${{ steps.filter.outputs.video_service }}
      job_service: ${{ steps.filter.outputs.job_service }}
      processing_service: ${{ steps.filter.outputs.processing_service }}
      contracts: ${{ steps.filter.outputs.contracts }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths-filter.yaml
      - name: Summarize changes
        shell: bash
        run: |
          {
            echo '## Componentes alterados'
            echo '- frontend: ${{ steps.filter.outputs.frontend }}'
            echo '- gateway: ${{ steps.filter.outputs.gateway }}'
            echo '- video_service: ${{ steps.filter.outputs.video_service }}'
            echo '- job_service: ${{ steps.filter.outputs.job_service }}'
            echo '- processing_service: ${{ steps.filter.outputs.processing_service }}'
            echo '- contracts: ${{ steps.filter.outputs.contracts }}'
            echo '- infrastructure: ${{ steps.filter.outputs.infrastructure }}'
            echo '- documentation: ${{ steps.filter.outputs.documentation }}'
          } >> "$GITHUB_STEP_SUMMARY"

  specifications:
    name: Validate specifications
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#.git/**"
      - name: Validate JSON Schemas
        run: python scripts/validate_json_schemas.py
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.51.2 lint --config redocly.yaml
      - name: Validate Docker Compose
        run: >-
          docker compose --env-file .env.example
          -f infrastructure/compose.yaml config --quiet
      - name: Reject infrastructure addresses in source
        run: python scripts/check_sensitive_addresses.py
      - name: Validate operational helpers
        run: |
          bash -n infrastructure/aws/deploy-service.sh infrastructure/aws/edge/deploy.sh infrastructure/aws/https/deploy.sh infrastructure/aws/observability/node-exporter.sh infrastructure/aws/observability/metrics-firewall.sh
          bash infrastructure/aws/test-deploy-service.sh
          python -m pip install pytest==9.1.1 httpx==0.28.1
          python -m pytest tests/load tests/deployment -q
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/aws/observability/alerts.yml:/etc/prometheus/alerts.yml:ro" -v "$PWD/tests/deployment/alerts.test.yml:/tests/alerts.test.yml:ro" prom/prometheus:v3.5.0 test rules /tests/alerts.test.yml
          python scripts/render_deployment.py edge --example
          docker run --rm -v "$PWD/infrastructure/aws/edge/proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine nginx -t

  links:
    name: Validate local links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true

  secrets:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Scan repository
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --no-banner

  video-service:
    name: Test Video Service
    needs: changes
    if: inputs.full-validation || needs.changes.outputs.video_service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres: &test_postgres
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: video_insight_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test against real PostgreSQL with coverage gate
        working-directory: services/video-service
        run: >-
          mvn -B verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/video_insight_test
          -Dspring.datasource.username=postgres
          -Dspring.datasource.password=test-only-password
      - run: docker build -t video-insight/video-service:test services/video-service

  job-service:
    name: Test Job Service
    needs: changes
    if: inputs.full-validation || needs.changes.outputs.job_service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres: *test_postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test against real PostgreSQL with coverage gate
        working-directory: services/job-service
        run: >-
          mvn -B verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/video_insight_test
          -Dspring.datasource.username=postgres
          -Dspring.datasource.password=test-only-password
      - run: docker build -t video-insight/job-service:test services/job-service

  processing-service:
    name: Test Processing Service
    needs: changes
    if: inputs.full-validation || needs.changes.outputs.processing_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run tests with coverage gate
        working-directory: services/processing-service
        run: |
          python -m pip install '.[test]'
          pytest
      - run: docker build -t video-insight/processing-service:test services/processing-service

  gateway:
    name: Validate API Gateway
    needs: changes
    if: inputs.full-validation || needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/render_deployment.py gateway --example
      - run: docker build -t video-insight/api-gateway:test apps/api-gateway
      - run: >-
          docker run --rm video-insight/api-gateway:test
          check -c /etc/krakend/krakend.json

  frontend:
    name: Test frontend
    needs: changes
    if: inputs.full-validation || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
          VITE_AUTH0_DOMAIN: example.auth0.com
          VITE_AUTH0_CLIENT_ID: ci-placeholder
          VITE_AUTH0_AUDIENCE: https://video-insight-api

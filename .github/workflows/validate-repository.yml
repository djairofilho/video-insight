name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      video_service: ${{ steps.filter.outputs.video_service }}
      job_service: ${{ steps.filter.outputs.job_service }}
      processing_service: ${{ steps.filter.outputs.processing_service }}
      contracts: ${{ steps.filter.outputs.contracts }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths-filter.yaml
      - name: Summarize changes
        shell: bash
        run: |
          {
            echo '## Componentes alterados'
            echo '- frontend: ${{ steps.filter.outputs.frontend }}'
            echo '- gateway: ${{ steps.filter.outputs.gateway }}'
            echo '- video_service: ${{ steps.filter.outputs.video_service }}'
            echo '- job_service: ${{ steps.filter.outputs.job_service }}'
            echo '- processing_service: ${{ steps.filter.outputs.processing_service }}'
            echo '- contracts: ${{ steps.filter.outputs.contracts }}'
            echo '- infrastructure: ${{ steps.filter.outputs.infrastructure }}'
            echo '- documentation: ${{ steps.filter.outputs.documentation }}'
          } >> "$GITHUB_STEP_SUMMARY"

  specifications:
    name: Validate specifications
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#.git/**"
      - name: Validate JSON Schemas
        run: python scripts/validate_json_schemas.py
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.51.2 lint --config redocly.yaml
      - name: Validate Docker Compose
        run: >-
          docker compose --env-file .env.example
          -f infrastructure/compose.yaml config --quiet

  links:
    name: Validate local links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true

  secrets:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Scan repository
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          detect --source=/repo --no-git --redact --no-banner

  video-service:
    name: Test Video Service
    needs: changes
    if: needs.changes.outputs.video_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t video-insight/video-service:test services/video-service

  job-service:
    name: Test Job Service
    needs: changes
    if: needs.changes.outputs.job_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t video-insight/job-service:test services/job-service

  processing-service:
    name: Test Processing Service
    needs: changes
    if: needs.changes.outputs.processing_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run tests with coverage gate
        working-directory: services/processing-service
        run: |
          python -m pip install '.[test]'
          pytest
      - run: docker build -t video-insight/processing-service:test services/processing-service

  gateway:
    name: Validate API Gateway
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t video-insight/api-gateway:test apps/api-gateway
      - run: >-
          docker run --rm video-insight/api-gateway:test
          check -c /etc/krakend/krakend.json

  frontend:
    name: Test frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
          VITE_AUTH0_DOMAIN: example.auth0.com
          VITE_AUTH0_CLIENT_ID: ci-placeholder
          VITE_AUTH0_AUDIENCE: https://video-insight-api
